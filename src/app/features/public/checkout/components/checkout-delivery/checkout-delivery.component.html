<!-- Shipping Method -->
<section class="checkout-card">
  <div class="checkout-card__head">
    <i class="pi pi-truck"></i>
    <span>Shipping Method</span>
  </div>
  <div class="checkout-card__body">
    @if (loading) {
      <div class="co-skeleton-stack" aria-label="Loading shipping options">
        <div class="co-skeleton-card skeleton-pulse"></div>
        <div class="co-skeleton-card skeleton-pulse"></div>
      </div>
    } @else {
      <div class="co-options" role="radiogroup" aria-label="Shipping method">
        @for (sm of shippingMethods; track sm.id) {
          <button
            class="co-option"
            [class.co-option--sel]="selectedMethod?.id === sm.id"
            (click)="selectMethod.emit(sm)"
            type="button"
            role="radio"
            [attr.aria-checked]="selectedMethod?.id === sm.id"
          >
            <div class="co-option__left">
              <span class="co-option__radio" aria-hidden="true">
                @if (selectedMethod?.id === sm.id) {
                  <span class="co-option__dot"></span>
                }
              </span>
              <div>
                <div class="co-option__name">{{ sm.name }}</div>
                <div class="co-option__desc">{{ sm.estimatedDeliveryTime }}</div>
              </div>
            </div>
            <span class="co-option__price" [class.co-option__price--free]="sm.baseFee === 0">
              @if (sm.baseFee === 0) {
                FREE
              } @else {
                From ${{ sm.baseFee.toFixed(2) }}
              }
            </span>
          </button>
        }
      </div>
    }
  </div>
</section>

<!-- Shipping Zone -->
<section class="checkout-card">
  <div class="checkout-card__head">
    <i class="pi pi-map-marker"></i>
    <span>Delivery Zone</span>
  </div>
  <div class="checkout-card__body">
    @if (loading) {
      <div class="co-skeleton-stack" aria-label="Loading delivery zones">
        <div class="co-skeleton-card skeleton-pulse"></div>
        <div class="co-skeleton-card skeleton-pulse"></div>
      </div>
    } @else {
      <div class="co-options" role="radiogroup" aria-label="Delivery zone">
        @for (zone of shippingZones; track zone.id) {
          <button
            class="co-option"
            [class.co-option--sel]="selectedZone?.id === zone.id"
            (click)="selectZone.emit(zone)"
            type="button"
            role="radio"
            [attr.aria-checked]="selectedZone?.id === zone.id"
          >
            <div class="co-option__left">
              <span class="co-option__radio" aria-hidden="true">
                @if (selectedZone?.id === zone.id) {
                  <span class="co-option__dot"></span>
                }
              </span>
              <div>
                <div class="co-option__name">{{ zone.name }}</div>
                <div class="co-option__desc">{{ zone.description }}</div>
              </div>
            </div>
            <span class="co-option__price" [class.co-option__price--free]="zone.fee === 0">
              @if (zone.fee === 0) {
                No extra fee
              } @else {
                +${{ zone.fee.toFixed(2) }}
              }
            </span>
          </button>
        }
      </div>
    }
  </div>
</section>
