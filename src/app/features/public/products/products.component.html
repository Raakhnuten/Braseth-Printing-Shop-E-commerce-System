<div class="shop-page">
  @if (heroBanners().length) {
    <app-hero-slider [banners]="heroBanners()" />
  }

  <section class="section container">
    <app-category-chip
      [categories]="categoryChips()"
      [selectedId]="selectedCategory()"
      (categorySelected)="onCategoryChange($event)"
    />
  </section>

  <div class="page-container">
    <app-sort-filter
      (sortChanged)="onSortChanged($event)"
      (filterChanged)="onFilterChanged($event)"
    />

    <!-- Content -->
    @if (loading()) {
      <div class="shop-grid">
        @for (_ of skeletonItems; track $index) {
          <div class="shop-skeleton-card">
            <div class="shop-skeleton-card__image skeleton-pulse"></div>
            <div class="shop-skeleton-card__body">
              <div class="skeleton-pulse" style="height: 14px; width: 85%; margin-bottom: 10px"></div>
              <div class="skeleton-pulse" style="height: 12px; width: 55%; margin-bottom: 8px"></div>
              <div class="skeleton-pulse" style="height: 24px; width: 35%; margin-bottom: 12px"></div>
              <div class="skeleton-pulse" style="height: 10px; width: 40%"></div>
            </div>
          </div>
        }
      </div>
    } @else if (filteredProducts().length === 0) {
      <app-empty-state
        title="No products found"
        message="Try adjusting your filters or search terms."
      />
    } @else {
      <div class="shop-grid">
        @for (product of filteredProducts(); track product.id) {
          <app-product-card [product]="product" />
        }
      </div>
    }
  </div>
</div>
